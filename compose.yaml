services:
  clips:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${CLIPS_DASHBOARD_PORT:-5678}:5678"
    environment:
      N8N_USER_FOLDER: /data/n8n
      N8N_HOST: localhost
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PORT: "5678"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      GENERIC_TIMEZONE: Asia/Kolkata
      NODES_EXCLUDE: '["n8n-nodes-base.localFileTrigger"]'
      CLIPS_CONFIG: /data/config.json
      CLIPS_STATE_DIR: /data/state
      CLIPS_EXPORT_DIR: /data/exports
      CLIPS_RECORDINGS_DIR: /data/recordings
    volumes:
      - ./data:/data
